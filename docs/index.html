<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logbook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='1' width='10' height='14' rx='1.5' fill='%23185FA5'/%3E%3Cpath d='M6 5h4M6 8h4' stroke='white' stroke-width='1.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1>Logbook<small id="generated"></small></h1>
      <a href="https://github.com/simonsablowski/logbook"><button type="button">Repository</button></a>
    </header>

    <div class="bar">
      <div class="tabs" role="tablist" aria-label="Views">
        <button class="tab" role="tab" id="tab-board" data-view="board" aria-controls="view">Board</button>
        <button class="tab" role="tab" id="tab-backlog" data-view="backlog" aria-controls="view">Backlog</button>
        <button class="tab" role="tab" id="tab-changelog" data-view="changelog" aria-controls="view">Changelog</button>
      </div>
      <label for="project" class="sr">Project</label>
      <select id="project"></select>
    </div>

    <main id="view" role="tabpanel"></main>
    <div id="backdrop"></div>
    <aside id="detail" aria-label="Ticket details"></aside>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
