<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logbook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='1' width='10' height='14' rx='1.5' fill='%23185FA5'/%3E%3Cpath d='M6 5h4M6 8h4' stroke='white' stroke-width='1.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <h1 class="sr">Logbook</h1>

    <div class="bar">
      <div class="bar-start">
        <div class="tabs" role="tablist" aria-label="Views">
          <button class="tab" role="tab" id="tab-projects" data-view="projects" aria-controls="view">Projects</button>
          <button class="tab" role="tab" id="tab-backlog" data-view="backlog" aria-controls="view">Backlog</button>
          <button class="tab" role="tab" id="tab-board" data-view="board" aria-controls="view">Board</button>
          <button class="tab" role="tab" id="tab-changelog" data-view="changelog" aria-controls="view">Changelog</button>
        </div>
        <label for="project" class="sr">Project</label>
        <select id="project"></select>
      </div>
      <div class="bar-end">
        <button id="signin" type="button" hidden>Sign in to edit</button>
        <div class="account" id="account" hidden>
          <button id="avatar" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu"></button>
          <div id="account-menu" class="menu" hidden>
            <div id="who" class="menu-user"></div>
            <button id="signout" type="button">Sign out</button>
          </div>
        </div>
      </div>
    </div>

    <main id="view" role="tabpanel"></main>
    <div id="backdrop"></div>
    <aside id="detail" aria-label="Ticket details"></aside>
    <div id="palette" class="menu palette" role="dialog" aria-label="Choose a colour" hidden></div>
    <div id="toast" role="status" hidden></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
